<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>gaslight.exe - Settings</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>gaslight.exe // SYSTEM CONFIGURATION</h1>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="settings">Settings</button>
            <button class="tab-btn" data-tab="story">Story Log</button>
            <button class="tab-btn" data-tab="privacy">Privacy</button>
        </div>
        
        <div id="settings" class="tab-content active">
            <h2>General Settings</h2>
            <div class="setting-row">
                <label>
                    <input type="checkbox" id="enable-sounds">
                    Enable Sound Effects
                </label>
            </div>
            <div class="setting-row">
                <label>
                    <input type="checkbox" id="accessibility-mode">
                    Accessibility Mode (Disables visual effects)
                </label>
            </div>
            <div class="setting-row">
                <label>
                    <input type="checkbox" id="reduce-motion">
                    Reduce Motion (Disables animations)
                </label>
            </div>
            <h2>Data Management</h2>
            <div class="button-group">
                <button id="export-settings">Export Settings</button>
                <button id="import-settings">Import Settings</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
            <button id="reset-all" class="danger">RESET ENTIRE EXPERIENCE</button>
        </div>
        
        <div id="story" class="tab-content">
            <h2>The Descent Log</h2>
            <div id="log-entries"></div>
        </div>
        
        <div id="privacy" class="tab-content">
            <h2>Privacy</h2>
            <p>All data is stored locally. Nothing is sent to any server.</p>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
